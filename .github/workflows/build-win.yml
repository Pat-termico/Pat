name: build-windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci falhou; tentando npm install..."
            npm install --ignore-scripts --no-audit --no-fund
          }
          $env:ELECTRON_CACHE = Join-Path (Get-Location) ".electron-cache"
          $env:ELECTRON_BUILDER_CACHE = Join-Path (Get-Location) ".electron-builder-cache"
          Write-Host "Recompilando native modules (serialport)..."
          try {
            npx electron-rebuild --version (node -e "process.stdout.write(require('./node_modules/electron/package.json').version)") 2>&1 | Out-String -Width 260
          } catch {
            Write-Host "electron-rebuild aviso (nao-fatal): $_"
          }

      - name: Lint and typecheck
        run: npm run lint

      - name: Build renderer
        run: npm run build:renderer

      - name: Show electron-builder version
        run: npx electron-builder --version

      - name: Build Windows executables
        env:
          DEBUG: "electron-builder,electron-rebuild"
          ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DashboardArduino-windows
          path: release/**
