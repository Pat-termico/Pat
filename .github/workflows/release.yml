name: release-windows-installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci falhou; tentando npm install --ignore-scripts..."
            npm install --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) {
              Write-Host "npm install fallback..."
              npm install --no-audit --no-fund
            }
          }
          $env:ELECTRON_CACHE = Join-Path (Get-Location) ".electron-cache"
          $env:ELECTRON_BUILDER_CACHE = Join-Path (Get-Location) ".electron-builder-cache"

      - name: Lint and typecheck
        run: npm run lint

      - name: Build renderer
        run: npm run build:renderer

      - name: Show versions
        run: |
          node -v
          npm -v
          npx electron-builder --version

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: "electron-builder"
          ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
        run: npx electron-builder --win --x64 --publish always

      - name: Upload artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashboardArduino-release-artifacts
          path: release/**
